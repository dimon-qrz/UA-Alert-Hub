<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Радар Тривог UA | Оперативна карта та моніторинг</title>
    <meta name="description" content="Оперативна інтерактивна мапа повітряних тривог України в реальному часі разом із актуальною стрічкою моніторингових новин.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            background-color: #0e0e0e;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 8px;
            gap: 4px;
        }
        /* Ліва панель */
        .tg-panel {
            width: 380px;
            min-width: 200px;
            max-width: 80vw;
            height: 100%;
            background: #181818;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* Розділювач (ресайзер) */
        .resizer {
            width: 6px;
            background: #2a2a2a;
            border-radius: 3px;
            cursor: ew-resize;
            transition: background 0.2s;
            z-index: 10;
        }
        .resizer:hover {
            background: #0088cc;
        }
        /* Права панель */
        .map-panel {
            flex: 1;
            height: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Кнопка «Картинка в картинці» (PiP) */
        .pip-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 100;
            font-size: 13px;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .pip-btn:hover {
            background: rgba(0, 136, 204, 0.9);
            border-color: transparent;
        }

        /* Режим плаваючого вікна (картинка в картинці) */
        .pip-mode {
            position: fixed !important;
            bottom: 20px !important;
            left: 20px !important;
            width: 400px !important;
            height: 300px !important;
            z-index: 9999 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #444;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .wrapper {
                flex-direction: column;
                overflow: auto;
            }
            .resizer { display: none; }
            .tg-panel, .map-panel {
                width: 100% !important;
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="wrapper">
        <!-- ЛІВИЙ БЛОК: Telegram канал -->
        <div class="tg-panel" id="tgPanel">
            <button class="pip-btn" onclick="togglePiP()">🗔 У вікно</button>
            <iframe src="https://t.me/s/povitryanatrivogaaa" title="Telegram канал моніторингу"></iframe>
        </div>

        <!-- РЕСАЙЗЕР (смуга для зміни розміру мишкою) -->
        <div class="resizer" id="resizer"></div>

        <!-- ПРАВИЙ БЛОК: Мапа тривог -->
        <div class="map-panel">
            <iframe src="https://alerts.in.ua/?pwa" title="Мапа повітряних тривог"></iframe>
        </div>
    </div>

    <script>
        // Логіка зміни розміру панелей мишкою
        const resizer = document.getElementById('resizer');
        const tgPanel = document.getElementById('tgPanel');

        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.addEventListener('mousemove', resize);
            document.addEventListener('mouseup', stopResize);
        });

        function resize(e) {
            if (!isResizing) return;
            const newWidth = e.clientX;
            if (newWidth > 200 && newWidth < window.innerWidth * 0.8) {
                tgPanel.style.width = newWidth + 'px';
            }
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', resize);
            document.removeEventListener('mouseup', stopResize);
        }

        // Логіка кнопки «Картинка в картинці» для Telegram-панелі
        function togglePiP() {
            tgPanel.classList.toggle('pip-mode');
            const btn = tgPanel.querySelector('.pip-btn');
            if (tgPanel.classList.contains('pip-mode')) {
                btn.textContent = '✕ На весь екран';
            } else {
                btn.textContent = '🗔 У вікно';
            }
        }
    </script>

</body>
</html>
