<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радар Тривог UA | Оперативна карта та моніторинг</title>
    <meta name="description" content="Оперативна інтерактивна мапа повітряних тривог України в реальному часі разом із актуальною стрічкою моніторингових новин.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; background-color: #0e0e0e; font-family: Arial, sans-serif; overflow: hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; padding: 8px; gap: 4px; position: relative; }
        
        .tg-panel { 
            width: 380px; 
            min-width: 250px; 
            height: 100%; 
            background: #181818; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        
        .tg-header {
            padding: 12px;
            background: #222;
            text-align: center;
            border-bottom: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tg-link-btn, .modal-open-btn {
            display: block;
            background: #0088cc;
            color: #fff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .tg-link-btn:hover, .modal-open-btn:hover {
            background: #006699;
        }
        .modal-open-btn {
            background: #27ae60;
        }
        .modal-open-btn:hover {
            background: #219653;
        }

        .tg-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .resizer { width: 6px; background: #2a2a2a; border-radius: 3px; cursor: ew-resize; z-index: 10; }
        .map-panel { flex: 1; height: 100%; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Плаваюче міні-вікно поверх усіх вікон (картинка в картинці) */
        .floating-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border: 2px solid #444;
            z-index: 9999;
            flex-direction: column;
            overflow: hidden;
        }
        .floating-modal.active {
            display: flex;
        }
        .modal-header {
            background: #2c2c2c;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-weight: bold;
        }
        .modal-close {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal-close:hover {
            background: #c0392b;
        }
        .modal-body {
            flex: 1;
            background: #000;
        }

        @media (max-width: 768px) {
            .wrapper { flex-direction: column; overflow: auto; }
            .resizer { display: none; }
            .tg-panel, .map-panel { width: 100% !important; height: 50vh; }
            .floating-modal { width: 95vw; height: 90vh; }
        }
    </style>
</head>
<body>
    <div class="wrapper" id="wrapper">
        <!-- ЛІВИЙ БЛОК -->
        <div class="tg-panel" id="tgPanel">
            <div class="tg-header">
                <a href="https://t.me/povitryanatrivogaaa" target="_blank" class="tg-link-btn">📢 Відкрити канал у Telegram</a>
                <button class="modal-open-btn" onclick="toggleModal(true)">🗔 Міні-вікно поверх мапи</button>
            </div>
            <div class="tg-content">
                <!-- Офіційний віджет останнього поста для швидкого перегляду -->
                <script async src="https://telegram.org/js/telegram-widget.js?22" 
                        data-telegram-post="povitryanatrivogaaa/225676" 
                        data-width="100%" 
                        data-dark="1">
                </script>
            </div>
        </div>

        <div class="resizer" id="resizer"></div>

        <!-- ПРАВИЙ БЛОК: Мапа тривог -->
        <div class="map-panel">
            <iframe src="https://alerts.in.ua/?pwa" title="Мапа повітряних тривог"></iframe>
        </div>
    </div>

    <!-- ПЛАВАЮЧЕ МІНІ-ВІКНО (Модальне вікно поверх усього) -->
    <div class="floating-modal" id="floatingModal">
        <div class="modal-header">
            <span>Оперативний моніторинг (Telegram)</span>
            <button class="modal-close" onclick="toggleModal(false)">✕ Закрити</button>
        </div>
        <div class="modal-body">
            <!-- Сюди можна підставити веб-версію через пряме посилання або зручний iframe-перегляд -->
            <iframe src="https://t.me/povitryanatrivogaaa" title="Telegram моніторинг"></iframe>
        </div>
    </div>

    <script>
        // Зміна розмірів панелей мишкою
        const resizer = document.getElementById('resizer');
        const tgPanel = document.getElementById('tgPanel');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            document.addEventListener('mousemove', resize);
            document.addEventListener('mouseup', stopResize);
        });

        function resize(e) {
            if (!isResizing) return;
            const newWidth = e.clientX;
            if (newWidth > 250 && newWidth < window.innerWidth * 0.8) {
                tgPanel.style.width = newWidth + 'px';
            }
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', resize);
            document.removeEventListener('mouseup', stopResize);
        }

        // Керування плаваючим міні-вікном
        function toggleModal(show) {
            const modal = document.getElementById('floatingModal');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
