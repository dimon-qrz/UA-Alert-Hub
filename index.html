<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта повітряних тривог та Telegram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            background-color: #0e0e0e;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            gap: 8px;
            padding: 8px;
        }
        /* Ліва панель для Telegram */
        .tg-panel {
            width: 380px;
            min-width: 320px;
            height: 100%;
            background: #181818;
            border-radius: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }
        /* Права панель для мапи */
        .map-panel {
            flex: 1;
            height: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Мобільна адаптивність */
        @media (max-width: 768px) {
            .wrapper {
                flex-direction: column;
                overflow: auto;
            }
            .tg-panel {
                width: 100%;
                height: 450px;
                min-width: 100%;
            }
            .map-panel {
                width: 100%;
                height: 500px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- ЛІВИЙ БЛОК: Telegram пост -->
        <div class="tg-panel">
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-post="povitryanatrivogaaa/225676" 
                    data-width="100%" 
                    data-dark="1">
            </script>
        </div>

        <!-- ПРАВИЙ БЛОК: Мапа тривог -->
        <div class="map-panel">
            <iframe src="https://alerts.in.ua/?pwa" title="Мапа повітряних тривог"></iframe>
        </div>
    </div>

</body>
</html>
