<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радар Тривог UA | Оперативна карта та моніторинг</title>
    <meta name="description" content="Оперативна інтерактивна мапа повітряних тривог України в реальному часі разом із актуальною стрічкою моніторингових новин.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; background-color: #0e0e0e; font-family: Arial, sans-serif; overflow: hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; padding: 8px; gap: 4px; }
        
        .tg-panel { 
            width: 380px; 
            min-width: 250px; 
            height: 100%; 
            background: #181818; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        
        /* Шапка лівої панелі з кнопкою */
        .tg-header {
            padding: 10px;
            background: #222;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .tg-link-btn {
            display: inline-block;
            background: #0088cc;
            color: #fff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .tg-link-btn:hover {
            background: #006699;
        }

        .tg-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .resizer { width: 6px; background: #2a2a2a; border-radius: 3px; cursor: ew-resize; }
        .map-panel { flex: 1; height: 100%; background: #000; border-radius: 8px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 768px) {
            .wrapper { flex-direction: column; overflow: auto; }
            .resizer { display: none; }
            .tg-panel, .map-panel { width: 100% !important; height: 50vh; }
        }
    </style>
</head>
<body>
    <div class="wrapper" id="wrapper">
        <!-- ЛІВИЙ БЛОК -->
        <div class="tg-panel" id="tgPanel">
            <div class="tg-header">
                <a href="https://t.me/povitryanatrivogaaa" target="_blank" class="tg-link-btn">📢 Відкрити весь канал у Telegram</a>
            </div>
            <div class="tg-content">
                <!-- Офіційний віджет останнього поста -->
                <script async src="https://telegram.org/js/telegram-widget.js?22" 
                        data-telegram-post="povitryanatrivogaaa/225676" 
                        data-width="100%" 
                        data-dark="1">
                </script>
            </div>
        </div>

        <div class="resizer" id="resizer"></div>

        <!-- ПРАВИЙ БЛОК: Мапа тривог -->
        <div class="map-panel">
            <iframe src="https://alerts.in.ua/?pwa" title="Мапа повітряних тривог"></iframe>
        </div>
    </div>

    <script>
        const resizer = document.getElementById('resizer');
        const tgPanel = document.getElementById('tgPanel');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            document.addEventListener('mousemove', resize);
            document.addEventListener('mouseup', stopResize);
        });

        function resize(e) {
            if (!isResizing) return;
            const newWidth = e.clientX;
            if (newWidth > 250 && newWidth < window.innerWidth * 0.8) {
                tgPanel.style.width = newWidth + 'px';
            }
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', resize);
            document.removeEventListener('mouseup', stopResize);
        }
    </script>
</body>
</html>
