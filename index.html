<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радар Тривог UA | Оперативна карта та моніторинг</title>
    <meta name="description" content="Оперативна інтерактивна мапа повітряних тривог України в реальному часі разом із актуальною стрічкою моніторингових новин.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; background-color: #0e0e0e; font-family: Arial, sans-serif; overflow: hidden; }
        .wrapper { display: flex; height: 100vh; width: 100vw; padding: 8px; gap: 4px; }
        
        /* Ліва панель з прямим посиланням */
        .tg-panel { 
            width: 380px; 
            min-width: 250px; 
            height: 100%; 
            background: #181818; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        
        .tg-card {
            background: #222;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .tg-card h3 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .tg-card p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .direct-link-btn {
            display: inline-block;
            background: #0088cc;
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .direct-link-btn:hover {
            background: #006699;
            transform: translateY(-2px);
        }

        .resizer { width: 6px; background: #2a2a2a; border-radius: 3px; cursor: ew-resize; }
        .map-panel { flex: 1; height: 100%; background: #000; border-radius: 8px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 768px) {
            .wrapper { flex-direction: column; overflow: auto; }
            .resizer { display: none; }
            .tg-panel, .map-panel { width: 100% !important; height: 50vh; }
        }
    </style>
</head>
<body>
    <div class="wrapper" id="wrapper">
        <!-- ЛІВИЙ БЛОК: Пряме посилання на канал -->
        <div class="tg-panel" id="tgPanel">
            <div class="tg-card">
                <h3>📢 Канал моніторингу</h3>
                <p>Оперативна інформація про повітряні тривоги та ситуацію в країні.</p>
                <a href="https://t.me/povitryanatrivogaaa" target="_blank" class="direct-link-btn">Відкрити канал у Telegram</a>
            </div>
        </div>

        <div class="resizer" id="resizer"></div>

        <!-- ПРАВИЙ БЛОК: Мапа тривог -->
        <div class="map-panel">
            <iframe src="https://alerts.in.ua/?pwa" title="Мапа повітряних тривог"></iframe>
        </div>
    </div>

    <script>
        const resizer = document.getElementById('resizer');
        const tgPanel = document.getElementById('tgPanel');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            document.addEventListener('mousemove', resize);
            document.addEventListener('mouseup', stopResize);
        });

        function resize(e) {
            if (!isResizing) return;
            const newWidth = e.clientX;
            if (newWidth > 250 && newWidth < window.innerWidth * 0.8) {
                tgPanel.style.width = newWidth + 'px';
            }
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', resize);
            document.removeEventListener('mouseup', stopResize);
        }
    </script>
</body>
</html>
